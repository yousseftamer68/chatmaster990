<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ChatMaster AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--p:#7c3aed;--pd:#6d28d9;--pl:#ede9fe;--bg:#fff;--bg2:#f9fafb;--bg3:#f3f4f6;--bd:#e5e7eb;--t:#111827;--t2:#6b7280;--t3:#9ca3af;}
[data-theme=dark]{--bg:#0f0f17;--bg2:#17172a;--bg3:#1e1e30;--bd:#2d2d45;--t:#f1f0ff;--t2:#9d9db8;--t3:#6b6b8a;--pl:#2d1b69;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);height:100vh;overflow:hidden;transition:background .2s,color .2s;}
#splash{position:fixed;inset:0;background:var(--p);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:999;transition:opacity .6s,transform .6s;}
#splash.hide{opacity:0;pointer-events:none;transform:scale(1.05);}
.sp-logo{width:80px;height:80px;background:rgba(255,255,255,.18);border-radius:22px;display:flex;align-items:center;justify-content:center;animation:spp 2s infinite;}
@keyframes spp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.sp-logo svg{width:46px;height:46px;}
.sp-name{font-size:38px;font-weight:800;color:#fff;letter-spacing:-1.5px;}
.sp-name span{opacity:.65;}
.sp-sub{font-size:14px;color:rgba(255,255,255,.6);letter-spacing:.05em;}
.sp-bar{width:180px;height:3px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;margin-top:6px;}
.sp-fill{height:100%;background:#fff;border-radius:3px;animation:spf 2s ease forwards;}
@keyframes spf{0%{width:0}100%{width:100%}}
.app{display:flex;height:100vh;}
.sb{width:260px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--bd);display:flex;flex-direction:column;transition:width .25s,opacity .25s;overflow:hidden;}
.sb.hide{width:0;opacity:0;}
.sb-top{padding:12px;}
.new-btn{width:100%;padding:10px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s;}
.new-btn:hover{background:var(--pd);}
.sb-lbl{padding:10px 14px 4px;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;}
.clist{flex:1;overflow-y:auto;padding:4px 8px;}
.clist::-webkit-scrollbar{width:3px;}
.clist::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px;}
.ci{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);transition:background .15s;margin-bottom:2px;}
.ci:hover{background:var(--bg3);}
.ci.on{background:var(--pl);color:var(--p);font-weight:500;}
.ci-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-del{opacity:0;font-size:14px;cursor:pointer;padding:2px 4px;border-radius:4px;}
.ci:hover .ci-del{opacity:1;}
.sb-foot{padding:10px 12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;}
.sb-act{padding:8px 10px;border-radius:8px;border:none;background:none;color:var(--t2);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;text-align:right;transition:background .15s;}
.sb-act:hover{background:var(--bg3);color:var(--t);}
.sb-brand{display:flex;align-items:center;gap:8px;padding:6px 10px;}
.sb-logo{width:24px;height:24px;background:var(--p);border-radius:7px;display:flex;align-items:center;justify-content:center;}
.sb-logo svg{width:14px;height:14px;}
.sb-bname{font-size:13px;font-weight:700;color:var(--t);}
.sb-bname span{color:var(--p);}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{padding:11px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;background:var(--bg);}
.tb-tog{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tb-tog:hover{background:var(--bg2);color:var(--t);}
.tb-title{flex:1;font-size:14px;font-weight:600;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-btns{display:flex;gap:5px;}
.tb-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;}
.tb-btn:hover{background:var(--bg2);color:var(--t);}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;text-align:center;}
.wl-logo{width:60px;height:60px;background:var(--p);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto;}
.wl-logo svg{width:34px;height:34px;}
.wl-h{font-size:26px;font-weight:800;color:var(--t);letter-spacing:-.8px;}
.wl-h span{color:var(--p);}
.wl-s{font-size:14px;color:var(--t2);max-width:380px;line-height:1.65;}
.wl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px;}
.wl-card{padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg2);text-align:right;cursor:pointer;transition:all .15s;}
.wl-card:hover{border-color:var(--p);background:var(--pl);}
.wl-ci{font-size:22px;margin-bottom:5px;}
.wl-ct{font-size:13px;font-weight:600;color:var(--t);margin-bottom:3px;}
.wl-cs{font-size:11px;color:var(--t2);}
.msgs{flex:1;overflow-y:auto;display:none;flex-direction:column;}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px;}
.msgs-in{max-width:720px;margin:0 auto;width:100%;padding:20px 16px;}
.mg{margin-bottom:22px;animation:fu .22s ease;}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.mrow{display:flex;gap:11px;align-items:flex-start;}
.mrow.ur{flex-direction:row-reverse;}
.mav{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.mav.bav{background:var(--p);color:#fff;}
.mav.uav{background:var(--bg3);color:var(--t2);}
.mc{flex:1;min-width:0;}
.mname{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:5px;}
.mrow.ur .mname{text-align:left;}
.mbub{padding:11px 14px;border-radius:15px;font-size:14px;line-height:1.7;direction:auto;word-break:break-word;}
.bbub{background:var(--bg2);border:1px solid var(--bd);border-bottom-right-radius:3px;color:var(--t);}
.ubub{background:var(--p);color:#fff;border-bottom-left-radius:3px;}
.bbub h1,.bbub h2,.bbub h3{margin:10px 0 6px;font-weight:700;}
.bbub h1{font-size:18px;}.bbub h2{font-size:16px;}.bbub h3{font-size:14px;}
.bbub p{margin-bottom:8px;}.bbub p:last-child{margin-bottom:0;}
.bbub ul,.bbub ol{padding-right:20px;margin-bottom:8px;}
.bbub li{margin-bottom:4px;}
.bbub strong{font-weight:700;}
.bbub code{background:var(--bg3);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px;color:var(--p);}
.bbub pre{background:#1e1e2e;border-radius:10px;padding:14px;overflow-x:auto;margin:10px 0;position:relative;}
.bbub pre code{background:none;color:#cdd6f4;padding:0;font-size:13px;}
.cp-btn{position:absolute;top:8px;left:8px;padding:3px 8px;background:rgba(255,255,255,.1);border:none;border-radius:5px;color:#cdd6f4;font-size:11px;cursor:pointer;}
.cp-btn:hover{background:rgba(255,255,255,.2);}
.bbub table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
.bbub th,.bbub td{border:1px solid var(--bd);padding:7px 10px;text-align:right;}
.bbub th{background:var(--bg3);font-weight:600;}
.macts{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;}
.mrow.ur .macts{justify-content:flex-end;}
.act{padding:4px 9px;border:1px solid var(--bd);border-radius:8px;background:none;color:var(--t2);font-size:11px;cursor:pointer;transition:all .15s;}
.act:hover{background:var(--bg2);color:var(--t);}
.act.liked{color:#16a34a;border-color:#16a34a;}
.act.disliked{color:#dc2626;border-color:#dc2626;}
.edit-ta{width:100%;padding:9px 11px;border:1px solid var(--p);border-radius:9px;background:var(--bg);color:var(--t);font-size:14px;font-family:inherit;resize:none;outline:none;margin-top:5px;direction:auto;}
.edit-acts{display:flex;gap:6px;margin-top:6px;}
.ebtn{padding:5px 12px;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:500;}
.esave{background:var(--p);color:#fff;}
.ecancel{background:var(--bg3);color:var(--t2);}
.typing-row{display:flex;gap:11px;align-items:flex-start;margin-bottom:22px;}
.tdots{display:flex;gap:5px;padding:13px 16px;background:var(--bg2);border:1px solid var(--bd);border-radius:15px;border-bottom-right-radius:3px;}
.td{width:7px;height:7px;border-radius:50%;background:var(--t3);animation:tb 1.2s infinite;}
.td:nth-child(2){animation-delay:.2s;}.td:nth-child(3){animation-delay:.4s;}
@keyframes tb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.inp-wrap{padding:12px 16px 16px;background:var(--bg);border-top:1px solid var(--bd);}
.inp-in{max-width:720px;margin:0 auto;}
.qp-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.qpc{padding:5px 11px;border:1px solid var(--bd);border-radius:20px;background:var(--bg2);color:var(--t2);font-size:12px;cursor:pointer;transition:all .15s;}
.qpc:hover{border-color:var(--p);color:var(--p);}
.inp-box{border:1.5px solid var(--bd);border-radius:16px;background:var(--bg2);overflow:hidden;transition:border-color .15s;}
.inp-box:focus-within{border-color:var(--p);}
.inp-top{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;}
#uin{flex:1;border:none;background:none;color:var(--t);font-size:14px;font-family:inherit;resize:none;outline:none;min-height:22px;max-height:140px;line-height:1.55;direction:auto;}
#uin::placeholder{color:var(--t3);}
.snd{width:38px;height:38px;border-radius:11px;background:var(--p);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.snd:hover{background:var(--pd);transform:scale(1.05);}
.snd:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.inp-bot{display:flex;align-items:center;gap:6px;padding:6px 12px 8px;border-top:1px solid var(--bd);}
.ibb{padding:4px 10px;border:1px solid var(--bd);border-radius:8px;background:none;color:var(--t2);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;}
.ibb:hover{background:var(--bg3);color:var(--t);}
.ibb.von{background:#fee2e2;border-color:#f87171;color:#dc2626;animation:pp 1s infinite;}
@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.isep{flex:1;}
.icc{font-size:10px;color:var(--t3);}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-ov.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg);border:1px solid var(--bd);border-radius:18px;padding:24px;width:460px;max-width:calc(100vw - 32px);max-height:85vh;overflow-y:auto;}
.modal h2{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--t);display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--t2);line-height:1;}
.fg{margin-bottom:16px;}
.fl{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px;display:block;}
.fsel{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--bg2);color:var(--t);font-size:13px;outline:none;}
.fsel:focus{border-color:var(--p);}
.fta{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--bg2);color:var(--t);font-size:13px;font-family:inherit;resize:vertical;min-height:80px;outline:none;direction:auto;}
.fta:focus{border-color:var(--p);}
.srow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);}
.srow:last-child{border-bottom:none;}
.sinfo{font-size:13px;color:var(--t);}
.ssub{font-size:11px;color:var(--t2);margin-top:2px;}
.tog{position:relative;width:40px;height:22px;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;inset:0;background:var(--bd);border-radius:22px;cursor:pointer;transition:.2s;}
.tog-sl:before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
.tog input:checked+.tog-sl{background:var(--p);}
.tog input:checked+.tog-sl:before{transform:translateX(18px);}
.len-btns{display:flex;gap:5px;}
.len-btn{flex:1;padding:7px;border:1px solid var(--bd);border-radius:8px;background:none;color:var(--t2);font-size:12px;cursor:pointer;text-align:center;transition:all .15s;}
.len-btn.on{border-color:var(--p);color:var(--p);background:var(--pl);font-weight:600;}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.btn-p{padding:9px 20px;background:var(--p);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-s{padding:9px 16px;background:var(--bg3);color:var(--t);border:none;border-radius:9px;font-size:13px;cursor:pointer;}
.vmod{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--bg);border:1.5px solid var(--p);border-radius:20px;padding:20px 28px;text-align:center;z-index:60;display:none;flex-direction:column;align-items:center;gap:12px;}
.vmod.open{display:flex;}
.vc{width:68px;height:68px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;animation:vcp 1.5s infinite;}
@keyframes vcp{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.4)}50%{box-shadow:0 0 0 14px rgba(124,58,237,0)}}
.vstop{padding:7px 18px;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;color:#b91c1c;font-size:12px;cursor:pointer;font-weight:600;}
.toast{position:fixed;bottom:24px;right:24px;padding:10px 16px;background:#1a1a2e;color:#fff;border-radius:10px;font-size:13px;z-index:200;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-logo">
    <svg viewBox="0 0 46 46" fill="none">
      <path d="M5 10C5 7.8 6.8 6 9 6H37C39.2 6 41 7.8 41 10V29C41 31.2 39.2 33 37 33H28L20 40V33H9C6.8 33 5 31.2 5 29V10Z" fill="white" opacity=".95"/>
      <circle cx="16" cy="20" r="2.5" fill="#7c3aed"/>
      <circle cx="23" cy="20" r="2.5" fill="#7c3aed"/>
      <circle cx="30" cy="20" r="2.5" fill="#7c3aed"/>
    </svg>
  </div>
  <div class="sp-name">Chat<span>Master</span></div>
  <div class="sp-sub">Your Intelligent AI Assistant</div>
  <div class="sp-bar"><div class="sp-fill"></div></div>
</div>
<div class="app">
  <div class="sb" id="sb">
    <div class="sb-top">
      <button class="new-btn" onclick="newChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        محادثة جديدة
      </button>
    </div>
    <div class="sb-lbl">المحادثات</div>
    <div class="clist" id="clist"></div>
    <div class="sb-foot">
      <button class="sb-act" onclick="openModal('set-modal')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 1 0 4.93 19.07"/></svg>
        الإعدادات
      </button>
      <button class="sb-act" onclick="openModal('ci-modal')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        تعليمات مخصصة
      </button>
      <div class="sb-brand">
        <div class="sb-logo"><svg viewBox="0 0 14 14" fill="none"><path d="M1 3C1 2 2 1 3 1H11C12 1 13 2 13 3V9C13 10 12 11 11 11H8L5.5 13V11H3C2 11 1 10 1 9V3Z" fill="white" opacity=".9"/></svg></div>
        <span class="sb-bname">Chat<span>Master</span></span>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <button class="tb-tog" onclick="document.getElementById('sb').classList.toggle('hide')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="tb-title" id="tbtitle">ChatMaster</span>
      <div class="tb-btns">
        <button class="tb-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
        <button class="tb-btn" onclick="openModal('set-modal')">⚙️</button>
      </div>
    </div>
    <div class="welcome" id="welcome">
      <div class="wl-logo">
        <svg viewBox="0 0 34 34" fill="none">
          <path d="M3 7C3 5.3 4.3 4 6 4H28C29.7 4 31 5.3 31 7V21C31 22.7 29.7 24 28 24H21L14 30V24H6C4.3 24 3 22.7 3 21V7Z" fill="white" opacity=".95"/>
          <circle cx="11" cy="14" r="2" fill="#7c3aed"/>
          <circle cx="17" cy="14" r="2" fill="#7c3aed"/>
          <circle cx="23" cy="14" r="2" fill="#7c3aed"/>
        </svg>
      </div>
      <div class="wl-h">مرحباً بك في <span>ChatMaster</span></div>
      <div class="wl-s">مساعدك الذكي — إسألني أي حاجة!</div>
      <div class="wl-grid" id="wlgrid"></div>
    </div>
    <div class="msgs" id="msgs"><div class="msgs-in" id="msgsin"></div></div>
    <div class="inp-wrap">
      <div class="inp-in">
        <div class="qp-row" id="qprow"></div>
        <div class="inp-box">
          <div class="inp-top">
            <textarea id="uin" placeholder="اسأل ChatMaster أي حاجة..." rows="1"></textarea>
            <button class="snd" id="sndbtn" onclick="send()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <div class="inp-bot">
            <button class="ibb" id="vbtn" onclick="toggleVoice()">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
              صوت
            </button>
            <button class="ibb" onclick="openModal('ci-modal')">✏️ تعليمات</button>
            <div class="isep"></div>
            <span class="icc" id="icc">0</span>
          </div>
        </div>
        <div style="text-align:center;font-size:10px;color:var(--t3);margin-top:7px;">ChatMaster AI — مساعدك الذكي الشخصي</div>
      </div>
    </div>
  </div>
</div>
<div class="modal-ov" id="set-modal">
  <div class="modal">
    <h2>الإعدادات <button class="modal-close" onclick="closeModal('set-modal')">×</button></h2>
    <div class="srow">
      <div><div class="sinfo">الوضع الليلي</div><div class="ssub">Dark / Light</div></div>
      <label class="tog"><input type="checkbox" id="dark-tog" onchange="toggleTheme()"><span class="tog-sl"></span></label>
    </div>
    <div class="srow">
      <div><div class="sinfo">قراءة الردود تلقائياً</div></div>
      <label class="tog"><input type="checkbox" id="autotts"><span class="tog-sl"></span></label>
    </div>
    <div class="srow">
      <div><div class="sinfo">صوت المساعد</div></div>

    <div class="fg"><label class="fl">معلومات عنك</label><textarea class="fta" id="ci-about" placeholder="مثال: أنا مطور ويب مصري..."></textarea></div>
    <div class="fg"><label class="fl">كيف تريد ChatMaster يتصرف؟</label><textarea class="fta" id="ci-style" placeholder="مثال: ردودك مختصرة وفيها أمثلة..."></textarea></div>
    <div class="ma"><button class="btn-s" onclick="closeModal('ci-modal')">إلغاء</button><button class="btn-p" onclick="saveCI()">حفظ</button></div>

<div class="vmod" id="vmod">
  <div class="vc"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></div>
  <div style="font-size:13px;color:var(--t2)" id="vstatus">جاري الاستماع...</div>

</div>
<div class="toast" id="toast"></div>
<script>
const API_KEY='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';
const API_URL='https://openrouter.ai/api/v1/chat/completions';
const LANGS={
  'ar-EG':{ph:'اسأل ChatMaster أي حاجة...',qp:['إيه أخبارك؟','احكيلي نكتة','اشرحلي الـ AI','ساعدني في كود'],cards:[{i:'💡',t:'أفكار',s:'اقتراحات'},{i:'💻',t:'برمجة',s:'كود وحل مشاكل'},{i:'✍️',t:'كتابة',s:'مقالات ورسائل'},{i:'🔍',t:'بحث',s:'معلومات وشرح'}]},
  'ar-SA':{ph:'اسأل ChatMaster...',qp:['كيف حالك؟','أخبرني نكتة','اشرح الذكاء الاصطناعي','مساعدة'],cards:[{i:'💡',t:'أفكار',s:'اقتراحات'},{i:'💻',t:'برمجة',s:'كود'},{i:'✍️',t:'كتابة',s:'مقالات'},{i:'🔍',t:'بحث',s:'معلومات'}]},
  'en-US':{ph:'Ask ChatMaster anything...',qp:['How are you?','Tell me a joke','Explain AI','Help with code'],cards:[{i:'💡',t:'Ideas',s:'Brainstorm'},{i:'💻',t:'Code',s:'Debug & write'},{i:'✍️',t:'Writing',s:'Articles'},{i:'🔍',t:'Research',s:'Info'}]},
  'fr-FR':{ph:'Demandez à ChatMaster...',qp:['Comment ça va?','Une blague?','Explique IA','Aide code'],cards:[{i:'💡',t:'Idées',s:'Suggestions'},{i:'💻',t:'Code',s:'Programmer'},{i:'✍️',t:'Écriture',s:'Articles'},{i:'🔍',t:'Recherche',s:'Info'}]},
  'es-ES':{ph:'Pregunta a ChatMaster...',qp:['¿Cómo estás?','Una broma','Explica IA','Código'],cards:[{i:'💡',t:'Ideas',s:'Sugerencias'},{i:'💻',t:'Código',s:'Programar'},{i:'✍️',t:'Escritura',s:'Artículos'},{i:'🔍',t:'Buscar',s:'Info'}]},
  'de-DE':{ph:'Frag ChatMaster...',qp:['Wie geht\'s?','Witz','KI erklären','Code'],cards:[{i:'💡',t:'Ideen',s:'Vorschläge'},{i:'💻',t:'Code',s:'Programmieren'},{i:'✍️',t:'Schreiben',s:'Artikel'},{i:'🔍',t:'Suche',s:'Info'}]},
  'tr-TR':{ph:'ChatMaster\'a sor...',qp:['Nasılsın?','Şaka','YZ açıkla','Kod'],cards:[{i:'💡',t:'Fikirler',s:'Öneriler'},{i:'💻',t:'Kod',s:'Geliştirme'},{i:'✍️',t:'Yazı',s:'Makaleler'},{i:'🔍',t:'Araştır',s:'Bilgi'}]},
  'zh-CN':{ph:'问ChatMaster...',qp:['你好吗？','讲笑话','解释AI','代码'],cards:[{i:'💡',t:'创意',s:'建议'},{i:'💻',t:'编程',s:'代码'},{i:'✍️',t:'写作',s:'文章'},{i:'🔍',t:'搜索',s:'信息'}]},
};
let S={convs:JSON.parse(localStorage.getItem('cm_convs')||'[]'),activeId:null,lang:'ar-EG',theme:'light',autoTts:false,voiceGender:'female',replyLen:'short',ciAbout:'',ciStyle:''};
function getSys(){
  const ci=[S.ciAbout,S.ciStyle].filter(Boolean).join(' | ');
  const len=S.replyLen==='short'?'ردودك مختصرة جداً (2-3 جمل فقط).':S.replyLen==='medium'?'ردودك متوسطة الطول.':'ردودك مفصلة وشاملة.';
  if(S.lang==='ar-EG')return`أنت ChatMaster، مساعد ذكاء اصطناعي. تتكلم بالعامية المصرية الجميلة دايماً. ${len} لا تذكر أي تقنية داخلية أبداً.${ci?' تعليمات: '+ci:''}`;
  if(S.lang==='ar-SA')return`أنت ChatMaster، مساعد ذكاء اصطناعي. تتحدث بالعربية الفصحى. ${len} لا تذكر أي تقنية داخلية.${ci?' تعليمات: '+ci:''}`;
  return`You are ChatMaster, an advanced AI assistant. ${S.replyLen==='short'?'Keep responses very concise (2-3 sentences).':S.replyLen==='medium'?'Give moderate responses.':'Give detailed responses.'} Never mention underlying technology. Reply in the user's language.${ci?' User instructions: '+ci:''}`;
}
function saveConvs(){localStorage.setItem('cm_convs',JSON.stringify(S.convs));}
function newChat(){S.activeId=null;document.getElementById('welcome').style.display='';const m=document.getElementById('msgs');m.style.display='none';document.getElementById('msgsin').innerHTML='';document.getElementById('tbtitle').textContent='ChatMaster';renderClist();buildWelcome();buildQP();}
function getActive(){return S.convs.find(c=>c.id===S.activeId)||null;}
function loadConv(id){S.activeId=id;const c=getActive();if(!c)return;document.getElementById('tbtitle').textContent=c.title||'محادثة';document.getElementById('welcome').style.display='none';const m=document.getElementById('msgs');m.style.display='flex';m.style.flexDirection='column';renderMsgs(c.messages);renderClist();}
function delConv(id,e){e.stopPropagation();S.convs=S.convs.filter(c=>c.id!==id);saveConvs();if(S.activeId===id)newChat();else renderClist();toast('تم الحذف');}
function renderClist(){const el=document.getElementById('clist');if(!S.convs.length){el.innerHTML='<div style="padding:12px;font-size:12px;color:var(--t3);text-align:center">لا توجد محادثات</div>';return;}el.innerHTML=S.convs.slice().reverse().map(c=>`<div class="ci ${c.id===S.activeId?'on':''}" onclick="loadConv('${c.id}')"><span style="font-size:13px">💬</span><span class="ci-title">${esc(c.title||'محادثة')}</span><span class="ci-del" onclick="delConv('${c.id}',event)">🗑</span></div>`).join('');}
function renderMsgs(msgs){const el=document.getElementById('msgsin');el.innerHTML=msgs.map((m,i)=>buildMsg(m,i)).join('');addCpBtns();el.parentElement.scrollTop=el.parentElement.scrollHeight;}
function buildMsg(m,i){const isU=m.role==='user';const md=typeof marked!=='undefined'?marked.parse:t=>esc(t);const bub=isU?`<div class="mbub ubub">${esc(m.content)}</div>`:`<div class="mbub bbub">${md(m.content||'')}</div>`;const acts=isU?`<div class="macts"><button class="act" onclick="editMsg(${i})">✏️ تعديل</button></div>`:`<div class="macts"><button class="act" onclick="copyMsg(${i},this)">📋 نسخ</button><button class="act" onclick="speakMsg(${i})">🔊 استمع</button><button class="act" onclick="regenMsg(${i})">🔄 إعادة</button><button class="act" id="lk${i}" onclick="rate(${i},1)">👍</button><button class="act" id="dk${i}" onclick="rate(${i},-1)">👎</button></div>`;return`<div class="mg"><div class="mrow ${isU?'ur':''}"><div class="mav ${isU?'uav':'bav'}">${isU?'👤':'CM'}</div><div class="mc"><div class="mname">${isU?'أنت':'ChatMaster'}</div>${bub}${acts}</div></div></div>`;}
function addCpBtns(){document.querySelectorAll('.bbub pre').forEach(pre=>{if(pre.querySelector('.cp-btn'))return;const b=document.createElement('button');b.className='cp-btn';b.textContent='نسخ';b.onclick=()=>{navigator.clipboard?.writeText(pre.querySelector('code')?.textContent||'');b.textContent='✓';setTimeout(()=>b.textContent='نسخ',1800);};pre.appendChild(b);});}
function addMsg(msg){const c=getActive();if(!c)return;c.messages.push(msg);saveConvs();const el=document.getElementById('msgsin');const i=c.messages.length-1;const div=document.createElement('div');div.innerHTML=buildMsg(msg,i);el.appendChild(div.firstElementChild);addCpBtns();el.parentElement.scrollTop=el.parentElement.scrollHeight;}
function showTyping(){document.getElementById('msgsin').innerHTML+=`<div class="typing-row" id="typ"><div class="mav bav">CM</div><div class="tdots"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>`;document.getElementById('msgs').scrollTop=99999;}
function hideTyping(){document.getElementById('typ')?.remove();}
async function send(txt){
  const inp=document.getElementById('uin');
  const text=(txt||inp.value).trim();if(!text)return;
  inp.value='';inp.style.height='auto';
  document.getElementById('sndbtn').disabled=true;
  document.getElementById('icc').textContent='0';
  if(!S.activeId){const id='c'+Date.now();S.convs.push({id,title:'...',messages:[]});S.activeId=id;document.getElementById('welcome').style.display='none';const m=document.getElementById('msgs');m.style.display='flex';m.style.flexDirection='column';renderClist();}
  addMsg({role:'user',content:text});showTyping();
  const c=getActive();
  try{
    const history=c.messages.slice(-18);
    const contents=history.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
    const msgs=[{role:'system',content:getSys()},...c.messages.slice(-18).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content}))];
    const res=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY,'HTTP-Referer':'https://chatmaster.app','X-Title':'ChatMaster'},
      body:JSON.stringify({model:'deepseek/deepseek-r1:free',messages:msgs})
    });
    const data=await res.json();
    if(data.error){hideTyping();addMsg({role:'assistant',content:'❌ خطأ: '+data.error.message});document.getElementById('sndbtn').disabled=false;return;}
    const reply=data.choices?.[0]?.message?.content||'خطأ.';
    hideTyping();addMsg({role:'assistant',content:reply});
    if(c.messages.length===2&&c.title==='...')autoTitle(c.id,text);
    if(S.autoTts)speakText(reply);
  }catch(e){hideTyping();addMsg({role:'assistant',content:'❌ مشكلة في الاتصال: '+e.message});}
  document.getElementById('sndbtn').disabled=false;
}
async function autoTitle(id,msg){
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY,'HTTP-Referer':'https://chatmaster.app','X-Title':'ChatMaster'},body:JSON.stringify({model:'deepseek/deepseek-r1:free',messages:[{role:'system',content:'أعط عنواناً قصيراً فقط.'},{role:'user',content:`عنوان قصير (3 كلمات) لمحادثة بدأت بـ: "${msg.slice(0,60)}". العنوان فقط.`}]})});
    const d=await res.json();
    const title=d.choices?.[0]?.message?.content?.trim()||msg.slice(0,20);
    const c=S.convs.find(x=>x.id===id);
    if(c){c.title=title;saveConvs();renderClist();document.getElementById('tbtitle').textContent=title;}
  }catch(e){}
}
function copyMsg(i,btn){const c=getActive();if(!c)return;navigator.clipboard?.writeText(c.messages[i]?.content||'');btn.textContent='✓ تم';setTimeout(()=>btn.textContent='📋 نسخ',1800);toast('تم النسخ');}
function rate(i,v){const l=document.getElementById('lk'+i),d=document.getElementById('dk'+i);if(v===1){l?.classList.toggle('liked');d?.classList.remove('disliked');}else{d?.classList.toggle('disliked');l?.classList.remove('liked');}}
function editMsg(i){const c=getActive();if(!c)return;const msg=c.messages[i];if(!msg||msg.role!=='user')return;const g=document.querySelectorAll('#msgsin .mg')[i];if(!g)return;const orig=msg.content;g.querySelector('.mbub').outerHTML=`<textarea class="edit-ta" id="edta" rows="2">${esc(orig)}</textarea><div class="edit-acts"><button class="ebtn esave" onclick="saveEdit(${i})">حفظ وإرسال</button><button class="ebtn ecancel" onclick="renderMsgs(getActive().messages)">إلغاء</button></div>`;}
function saveEdit(i){const c=getActive();if(!c)return;const t=document.getElementById('edta')?.value?.trim();if(!t)return;c.messages=c.messages.slice(0,i);renderMsgs(c.messages);send(t);}
async function regenMsg(i){const c=getActive();if(!c||c.messages[i]?.role!=='assistant')return;c.messages=c.messages.slice(0,i);renderMsgs(c.messages);showTyping();try{const history=c.messages.slice(-18);const contents=history.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));const msgs2=[{role:'system',content:getSys()},...c.messages.slice(-18).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content}))];const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY,'HTTP-Referer':'https://chatmaster.app','X-Title':'ChatMaster'},body:JSON.stringify({model:'deepseek/deepseek-r1:free',messages:msgs2})});const d=await res.json();hideTyping();addMsg({role:'assistant',content:d.choices?.[0]?.message?.content||'خطأ.'});}catch(e){hideTyping();addMsg({role:'assistant',content:'خطأ.'});}}
function speakMsg(i){const c=getActive();if(c?.messages[i])speakText(c.messages[i].content);}
function speakText(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[#*`_~\[\]]/g,''));u.lang=S.lang;u.rate=1;const v=window.speechSynthesis.getVoices().find(x=>x.lang.startsWith(S.lang.slice(0,2))&&(S.voiceGender==='female'?/female|woman|zira|samantha/i.test(x.name):!/female|woman|zira|samantha/i.test(x.name)));if(v)u.voice=v;window.speechSynthesis.speak(u);}
let recognition=null,isListening=false;
function toggleVoice(){if(isListening){stopVoice();return;}if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){toast('المتصفح لا يدعم الصوت');return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang=S.lang;recognition.continuous=false;recognition.interimResults=true;document.getElementById('vmod').classList.add('open');document.getElementById('vbtn').classList.add('von');recognition.onresult=e=>{const t=Array.from(e.results).map(r=>r[0].transcript).join('');document.getElementById('uin').value=t;document.getElementById('vstatus').textContent=t;};recognition.onend=()=>{isListening=false;const t=document.getElementById('uin').value.trim();stopVoice();if(t)send(t);};recognition.onerror=()=>{isListening=false;stopVoice();};recognition.start();isListening=true;}
function stopVoice(){recognition&&recognition.stop();isListening=false;document.getElementById('vbtn').classList.remove('von');document.getElementById('vmod').classList.remove('open');}
function toggleTheme(){S.theme=S.theme==='light'?'dark':'light';if(S.theme==='dark')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');document.getElementById('theme-btn').textContent=S.theme==='dark'?'☀️':'🌙';document.getElementById('dark-tog').checked=S.theme==='dark';}
function setLen(btn){document.querySelectorAll('.len-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');S.replyLen=btn.dataset.l;}
function setLang(code){S.lang=code;buildQP();buildWelcome();}
function saveCI(){S.ciAbout=document.getElementById('ci-about').value;S.ciStyle=document.getElementById('ci-style').value;closeModal('ci-modal');toast('تم حفظ التعليمات');}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-ov').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
document.getElementById('autotts').addEventListener('change',function(){S.autoTts=this.checked;});
document.getElementById('vgender').addEventListener('change',function(){S.voiceGender=this.value;});
function buildWelcome(){const l=LANGS[S.lang]||LANGS['ar-EG'];document.getElementById('wlgrid').innerHTML=l.cards.map(c=>`<div class="wl-card" onclick="send('${c.t}')"><div class="wl-ci">${c.i}</div><div class="wl-ct">${c.t}</div><div class="wl-cs">${c.s}</div></div>`).join('');}
function buildQP(){const l=LANGS[S.lang]||LANGS['ar-EG'];document.getElementById('qprow').innerHTML=l.qp.map(p=>`<button class="qpc" onclick="send('${p}')">${p}</button>`).join('');document.getElementById('uin').placeholder=l.ph||'اسأل ChatMaster...';}
const inp=document.getElementById('uin');
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px';document.getElementById('icc').textContent=this.value.length;});
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let tt;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2500);}
buildWelcome();buildQP();renderClist();
setTimeout(()=>document.getElementById('splash').classList.add('hide'),2200);
</script>
